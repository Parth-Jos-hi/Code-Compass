services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - ./backend/chroma_data:/app/chroma_data
      - ./backend/local_compass.db:/app/local_compass.db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://backend:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
